<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Crossing 800×600 light</title><link rel="stylesheet" href="colony-comp.css"></head><body data-theme="light" data-incumbents="ListInspector Splitter Menu Icon" data-tokens="--bg --surface --fg --accent --border-soft"><div class="app"><header class="topbar"><button class="destination keep" data-control data-annotation="--muted">Tasks</button><button class="destination selected" data-control data-annotation="--accent">Bot Crossing</button><span class="top-spacer"></span><button class="destination" data-control data-annotation="Menu">View</button><button class="icon-button" data-control data-annotation="Icon">AJ</button></header><main class="workspace"><aside class="rail annotation" data-callout="1"><div class="pane-head"><h1>Bot Crossing</h1></div><div class="search"><input aria-label="Search tasks" placeholder="Find task" data-control data-annotation="ListInspector"><div class="search-pair"><select aria-label="Harness filter" data-control data-annotation="ListInspector"><option>Harness</option></select><select aria-label="Status filter" data-control data-annotation="ListInspector"><option>Status</option></select></div></div><div class="list"><div class="group">Needs attention · 2</div><button class="row selected" data-control data-annotation="ListInspector"><i class="dot wait"></i><span class="row-copy"><strong>Colony receiver contract</strong><small>Codex · waiting</small></span></button><button class="row worker" data-control data-annotation="ListInspector"><i class="dot work"></i><span class="row-copy"><strong>worker-07 exact-task opening</strong><small>working</small></span></button><button class="secondary" data-control data-annotation="ListInspector">Inspect selected task</button></div></aside><div class="splitter annotation" data-callout="2" data-control data-annotation="Splitter"></div><section class="scene annotation" data-callout="3" tabindex="0" data-control data-annotation="--surface"><div class="scene-title"><strong>Rhythm</strong><span>Inspector replaces rail when opened</span></div><i class="bot one"></i><i class="bot two"></i><div class="scene-toolbar"><button aria-label="Reset camera" data-control data-annotation="Icon">⌂</button><button aria-label="Next task needing attention" data-control data-annotation="Icon">!</button></div><div class="note-strip">At 200% zoom this becomes one pane: list → scene → inspector.</div></section><div class="splitter second" data-control data-annotation="Splitter"></div><aside class="inspector"><button data-control data-annotation="ListInspector">Back to list</button></aside></main></div></body></html>
