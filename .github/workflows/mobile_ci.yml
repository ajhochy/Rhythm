name: Mobile CI

on:
  # Only the default branch pushes here. On a PR branch the `pull_request`
  # trigger below is the one whose result the PR reports, so listening to both
  # events launched two identical suites per commit (#1287 runner contention).
  # Restricting push to `main` removes the duplicate at the source, which is
  # strictly better than launching both and cancelling one (#1329).
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/opencode_fork/packages/opencode/package.json'
      - 'apps/opencode_fork/packages/sdk/openapi.json'
      - 'docs/ai/evidence/**'
      - 'docs/ai/runs/**'
      - 'docs/ai/project-state.md'
      - 'tests/contract/issue-1175.mjs'
      - '.github/workflows/mobile_ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/opencode_fork/packages/opencode/package.json'
      - 'apps/opencode_fork/packages/sdk/openapi.json'
      - 'docs/ai/evidence/**'
      - 'docs/ai/runs/**'
      - 'docs/ai/project-state.md'
      - 'tests/contract/issue-1175.mjs'
      - '.github/workflows/mobile_ci.yml'

# #1329: this used to key on the head SHA to collapse the push/pull_request pair
# into one run. It did dedupe them — but `cancel-in-progress` then killed one of
# two runs for the SAME commit, and which one died was a race. When the loser was
# the `pull_request` run, the PR reported a red check with a cancelled job and no
# failing test, indistinguishable from a real failure. Observed flipping across
# 558f7e04 / ee6ea444 / 8faea09f.
#
# The duplicate is now prevented by the trigger scoping above, so this group only
# has to supersede OLDER commits on the same branch/PR — never a sibling event for
# the same commit. Keying on the ref (not the SHA) is what makes that work.
concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    env:
      CI: 'true'
      EXPO_PUBLIC_E2E_MODE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify mobile foundation
        run: npm run verify:foundation

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-report
          path: apps/mobile/playwright-report
          if-no-files-found: ignore
