name: Web Unit CI

# The desktop web app's node:test unit suites (apps/web/tests/*.test.mjs) were
# never executed by any CI job; the coordinator issuance/controller tests only
# ran by hand. This job runs them on every PR that touches apps/web.
# Run every node:test unit suite, including notification errors and
# transcript reasoning/usage rendering.

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web_unit_ci.yml'

jobs:
  web-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Three coordinator suites render with react / react-test-renderer resolved
      # from apps/mobile (createRequire('../mobile/package.json')).
      - name: Install mobile deps for react-test-renderer
        working-directory: apps/mobile
        run: npm ci
      - name: Unit tests (node:test)
        run: npm run test:unit
