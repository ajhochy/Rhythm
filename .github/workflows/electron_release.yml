name: Electron Release

# React/Electron parity program (docs/ai/plans/2026-08-15-post-m1-parity-phases.md, Phase 11).
# apps/electron is currently the reference/prototype client, not the shipping desktop app
# (apps/desktop_flutter is) — this workflow exists so a signed, notarized build is possible for
# parity testing, not so this becomes the primary release channel. Mirrors desktop_release.yml's
# shape. The Electron shell bundles the API server, matching Node runtime and freshly built
# Rhythm fork — see apps/electron/scripts/package-mac.mjs.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: true
        default: true
        type: boolean
      qualification_only:
        description: 'Sign and upload qualification artifacts without publishing a release'
        required: false
        default: false
        type: boolean
      release_notes:
        description: 'Optional release notes override'
        required: false
        type: string

jobs:
  build-macos-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      RHYTHM_PACKAGE_ARCH: ${{ matrix.arch }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: electron-v${{ inputs.version }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          architecture: ${{ matrix.arch }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Check out pinned Hermes Desktop source
        run: |
          set -euo pipefail
          HERMES_DESKTOP_SOURCE_COMMIT="$(node --input-type=module -e "import('./apps/electron/src/hermes-desktop-config.mjs').then(({ PINNED_HERMES_DESKTOP_SOURCE_COMMIT }) => process.stdout.write(PINNED_HERMES_DESKTOP_SOURCE_COMMIT))")"
          [[ "${HERMES_DESKTOP_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          HERMES_DESKTOP_ROOT="${RUNNER_TEMP}/hermes-rhythm-plugin"
          git init "${HERMES_DESKTOP_ROOT}"
          git -C "${HERMES_DESKTOP_ROOT}" remote add origin https://github.com/ajhochy/hermes-rhythm-plugin.git
          git -C "${HERMES_DESKTOP_ROOT}" fetch --depth=1 origin "${HERMES_DESKTOP_SOURCE_COMMIT}"
          git -C "${HERMES_DESKTOP_ROOT}" checkout --detach FETCH_HEAD
          test "$(git -C "${HERMES_DESKTOP_ROOT}" rev-parse HEAD)" = "${HERMES_DESKTOP_SOURCE_COMMIT}"
          echo "HERMES_DESKTOP_ROOT=${HERMES_DESKTOP_ROOT}" >> "$GITHUB_ENV"
          echo "HERMES_DESKTOP_SOURCE_COMMIT=${HERMES_DESKTOP_SOURCE_COMMIT}" >> "$GITHUB_ENV"

      - name: Build pinned Hermes Desktop artifact
        run: |
          set -euo pipefail
          test "$(git -C "${HERMES_DESKTOP_ROOT}" rev-parse HEAD)" = "${HERMES_DESKTOP_SOURCE_COMMIT}"
          test "$(node -p 'process.arch')" = "${RHYTHM_PACKAGE_ARCH}"
          export npm_config_python="$(command -v python3)"
          npm ci --prefix "${HERMES_DESKTOP_ROOT}"
          GITHUB_SHA= GITHUB_REF_NAME= GITHUB_HEAD_REF= npm --prefix "${HERMES_DESKTOP_ROOT}/apps/desktop" run build:rhythm-embedded
          ARTIFACT_ROOT="${HERMES_DESKTOP_ROOT}/apps/desktop/build/rhythm-embedded"
          test -f "${ARTIFACT_ROOT}/manifest.json"
          echo "RHYTHM_HERMES_DESKTOP_ARTIFACT_DIR=${ARTIFACT_ROOT}" >> "$GITHUB_ENV"

      - name: Install vendored fork dependencies
        working-directory: apps/opencode_fork
        run: bun install --frozen-lockfile

      - name: Install dependencies
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/api_server ci
          npm --prefix apps/electron ci

      - name: Typecheck the Electron shell
        working-directory: apps/electron
        run: npm run typecheck

      - name: Test unsigned package contracts
        working-directory: apps/electron
        run: |
          node --test test/electron-e10-engine-package.test.mjs
          npm run test:package

      - name: Build final unsigned package
        working-directory: apps/electron
        run: npm run package:mac

      - name: Test the Electron shell with packaged assets
        working-directory: apps/electron
        run: npm test

      - name: Import signing certificate into a temporary keychain
        run: |
          set -euo pipefail
          KEYCHAIN_NAME="electron-build-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$(mktemp -t rhythm-electron-cert).p12"
          echo "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_NAME}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_NAME}" -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "${KEYCHAIN_NAME}" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          rm -f "${CERT_PATH}"

      - name: Sign and notarize
        working-directory: apps/electron
        run: npm run sign:mac

      - name: Verify signed bundle
        run: |
          APP="apps/electron/dist/Rhythm.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose "$APP"

      - name: Packaged smoke against the SIGNED bundle (post-m1-p11-c4)
        run: |
          set -euo pipefail
          APP="apps/electron/dist/Rhythm.app"
          SMOKE_ROOT="$(mktemp -d)"
          trap 'rm -rf "${SMOKE_ROOT}"' EXIT
          RHYTHM_SHELL_USER_DATA="${SMOKE_ROOT}" \
            "${APP}/Contents/MacOS/Rhythm" --smoke --security-smoke

      - name: Name native architecture archive
        run: mv apps/electron/dist/Rhythm.zip apps/electron/dist/Rhythm-${{ matrix.arch }}.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-electron-macos-${{ matrix.arch }}-${{ inputs.version }}
          path: |
            apps/electron/dist/Rhythm-${{ matrix.arch }}.zip

      - name: Publish GitHub release
        if: ${{ !inputs.qualification_only && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Rhythm Electron (parity reference) ${{ env.RELEASE_TAG }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: ${{ inputs.release_notes == '' }}
          body: ${{ inputs.release_notes }}
          files: |
            apps/electron/dist/Rhythm-${{ matrix.arch }}.zip
