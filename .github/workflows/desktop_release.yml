name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: true
        default: false
        type: boolean
      release_notes:
        description: 'Optional release notes override'
        required: false
        type: string

jobs:
  build-macos-release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_AUTH_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
      GOOGLE_AUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      PCO_APPLICATION_ID: ${{ secrets.PCO_APPLICATION_ID }}
      PCO_SECRET: ${{ secrets.PCO_SECRET }}
      PCO_REDIRECT_URI: ${{ secrets.PCO_REDIRECT_URI }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # #1023 — Pin ONE Node version for the whole release. better-sqlite3 is
      # compiled against this Node's ABI (in every npm install below) AND the
      # matching Node binary is bundled into the app, so the app always runs
      # the embedded server under a Node whose ABI equals the compiled
      # better_sqlite3.node by construction. Without this pin the runner drifts
      # (e.g. to Node 24 / ABI 137) while the user machine runs a different Node
      # (ABI 127) → ERR_DLOPEN_FAILED at initDb → agent server never binds.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Flutter dependencies
        working-directory: apps/desktop_flutter
        run: flutter pub get

      - name: Verify desktop app
        working-directory: apps/desktop_flutter
        run: |
          dart format --output=none --set-exit-if-changed .
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build CLI server
        working-directory: apps/api_server
        run: |
          npm install
          npx vitest run src/__tests__/skill_schema_parity.test.ts
          npm run build
          npm prune --omit=dev

      - name: Configure macOS release build
        working-directory: apps/desktop_flutter
        run: |
          flutter clean
          flutter build macos --release --config-only \
            --build-name="$RELEASE_VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=GOOGLE_DESKTOP_CLIENT_ID="$GOOGLE_DESKTOP_CLIENT_ID"

      - name: Build macOS release
        working-directory: apps/desktop_flutter/macos
        run: >
          xcodebuild -workspace Runner.xcworkspace -scheme Runner
          -configuration Release
          -derivedDataPath ../build/macos
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          ONLY_ACTIVE_ARCH=NO
          ARCHS="arm64 x86_64"
          build

      - name: Verify desktop OAuth build
        run: |
          tools/release/verify_desktop_oauth_build.sh \
            apps/desktop_flutter/build/macos/Build/Products/Release/Rhythm.app

      - name: Bundle CLI server into app
        working-directory: apps/desktop_flutter
        run: |
          APP="build/macos/Build/Products/Release/Rhythm.app"
          DEST="$APP/Contents/Resources/api_server"
          mkdir -p "$DEST"
          cp -r ../api_server/dist "$DEST/"
          cp -r ../api_server/scripts "$DEST/"
          # Vendored engine plugins (rhythm-anthropic-accounts) — resolved at
          # runtime by rhythmAnthropicPluginPath() as a sibling of dist/
          cp -r ../api_server/opencode_plugins "$DEST/"
          # Config seed assets (config-doctor tools + customize-rhythm skill) —
          # seeded to ~/.config/opencode/ at boot by config_seeds_seeder.ts,
          # resolved at runtime as a sibling of dist/.
          cp -r ../api_server/config_seeds "$DEST/"
          cp -r ../api_server/resources "$DEST/"
          cp ../api_server/package.json "$DEST/"
          cp ../api_server/package-lock.json "$DEST/"
          (
            cd "$DEST"
            npm install --omit=dev
          )
          # Vendor the pinned js-yaml into the bundled config-doctor tools so the
          # shipped seed carries tools/node_modules/js-yaml (the classifiers'
          # preferred resolver; falls back to the app bundle's js-yaml otherwise).
          (
            cd "$DEST/config_seeds/tools"
            npm install --omit=dev
          )
          # Write OAuth secrets into a .env file loaded by the CLI server at runtime
          printf 'GOOGLE_CLIENT_ID=%s\nGOOGLE_AUTH_CLIENT_ID=%s\nGOOGLE_AUTH_CLIENT_SECRET=%s\nGOOGLE_CLIENT_SECRET=%s\nGOOGLE_REDIRECT_URI=%s\nPCO_APPLICATION_ID=%s\nPCO_SECRET=%s\nPCO_REDIRECT_URI=%s\n' \
            "$GOOGLE_CLIENT_ID" "$GOOGLE_AUTH_CLIENT_ID" "$GOOGLE_AUTH_CLIENT_SECRET" "$GOOGLE_CLIENT_SECRET" "$GOOGLE_REDIRECT_URI" \
            "$PCO_APPLICATION_ID" "$PCO_SECRET" "$PCO_REDIRECT_URI" \
            > "$DEST/.env"

      - name: Verify bundled CLI server payload
        working-directory: apps/desktop_flutter
        run: |
          DEST="build/macos/Build/Products/Release/Rhythm.app/Contents/Resources/api_server"
          test -f "$DEST/dist/server.js"
          test -f "$DEST/scripts/postinstall.js"
          test -f "$DEST/opencode_plugins/rhythm-anthropic-accounts/dist/index.js"
          test -f "$DEST/opencode_plugins/rhythm-anthropic-accounts/dist/accounts.js"
          test -f "$DEST/package.json"
          test -f "$DEST/package-lock.json"
          test -f "$DEST/.env"
          test -d "$DEST/node_modules"
          test -f "$DEST/node_modules/better-sqlite3/package.json"
          test -f "$DEST/config_seeds/skills/customize-rhythm/SKILL.md"
          test -f "$DEST/config_seeds/tools/classify.cjs"
          test -f "$DEST/config_seeds/tools/node_modules/js-yaml/package.json"
          test -f "$DEST/resources/openmontage-mcp/openmontage_mcp_server.py"

      - name: Bundle MCP role files into app (#1154)
        working-directory: apps/desktop_flutter
        run: |
          # Sibling of Resources/api_server. ApiServerService points
          # MCP_ROLES_DIR at this path (see _findServer's bundled branch) so
          # POST /agent-sessions {mcpRole:"secretary"} resolves in the shipped
          # .app the same way it does in dev against the repo-root .mcp-roles/.
          APP="build/macos/Build/Products/Release/Rhythm.app"
          DEST="$APP/Contents/Resources/.mcp-roles"
          mkdir -p "$DEST"
          cp -r ../../.mcp-roles/. "$DEST/"

      - name: Verify bundled MCP role files payload
        working-directory: apps/desktop_flutter
        run: |
          DEST="build/macos/Build/Products/Release/Rhythm.app/Contents/Resources/.mcp-roles"
          test -f "$DEST/secretary.mcp.json"
          test -f "$DEST/email-assistant.mcp.json"
          test -f "$DEST/graphic-designer.mcp.json"
          test -f "$DEST/org-optimizer.mcp.json"
          test -f "$DEST/org-external-discovery.mcp.json"

      - name: Bundle Node runtime into app (#1023)
        working-directory: apps/desktop_flutter
        shell: bash
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/Rhythm.app"
          DEST="$APP/Contents/Resources/node/bin"
          mkdir -p "$DEST"
          # Copy the SAME Node binary that just compiled better-sqlite3 (the
          # pinned setup-node runtime). Copying — rather than re-downloading —
          # guarantees the bundled Node's ABI equals the compiled
          # better_sqlite3.node ABI by construction. `process.execPath` resolves
          # the real binary behind any toolcache symlink (BSD readlink lacks -f).
          NODE_REAL="$(node -e 'process.stdout.write(process.execPath)')"
          echo "Bundling Node from: $NODE_REAL ($(node --version))"
          cp "$NODE_REAL" "$DEST/node"
          chmod +x "$DEST/node"
          BUNDLED_ABI="$("$DEST/node" -e 'process.stdout.write(process.versions.modules)')"
          echo "Bundled Node ABI (process.versions.modules) = $BUNDLED_ABI"
          # Prove the bundled Node can actually dlopen + use the bundled
          # better-sqlite3. On an ABI mismatch this throws ERR_DLOPEN_FAILED and
          # FAILS the release here instead of shipping a broken agent server.
          BSQLITE="$PWD/$APP/Contents/Resources/api_server/node_modules/better-sqlite3"
          "$DEST/node" -e "
            const Database = require('$BSQLITE');
            const db = new Database(':memory:');
            const row = db.prepare('select 1 as x').get();
            if (row.x !== 1) { console.error('better-sqlite3 query wrong'); process.exit(1); }
            console.log('bundled Node loads bundled better-sqlite3 OK (ABI ' + process.versions.modules + ')');
          "

      - name: Verify bundled Node payload (#1023)
        working-directory: apps/desktop_flutter
        run: |
          NODE="build/macos/Build/Products/Release/Rhythm.app/Contents/Resources/node/bin/node"
          test -f "$NODE"
          test -x "$NODE"
          "$NODE" --version

      - name: Build rhythm MCP server
        working-directory: apps/mcp_server
        run: |
          npm install
          npm run build

      - name: Bundle rhythm MCP server into app (#814)
        working-directory: apps/desktop_flutter
        run: |
          # Sibling of Resources/api_server + Resources/opencode_bin. Launched
          # by absolute path (resolveRhythmMcpCommand in opencode_client_service.ts)
          # — no npx, no global install, no network at launch time. When this
          # payload is absent (e.g. an older release predating this step), the
          # command builder falls back to a version-PINNED npx spec, never a
          # bare unversioned one.
          APP="build/macos/Build/Products/Release/Rhythm.app"
          DEST="$APP/Contents/Resources/mcp_server"
          mkdir -p "$DEST"
          cp -r ../mcp_server/dist "$DEST/"
          cp ../mcp_server/package.json "$DEST/"
          cp ../mcp_server/package-lock.json "$DEST/"
          (
            cd "$DEST"
            # --ignore-scripts: dist/ is already built and copied in above;
            # without this, npm's prepare lifecycle re-runs `npm run build`
            # (tsc) even for a bare install, and --omit=dev skips the
            # typescript devDependency tsc needs, failing with exit 127.
            # Safe here: mcp_server has no native/compiled runtime deps.
            npm install --omit=dev --ignore-scripts
          )

      - name: Verify bundled rhythm MCP server payload
        working-directory: apps/desktop_flutter
        run: |
          DEST="build/macos/Build/Products/Release/Rhythm.app/Contents/Resources/mcp_server"
          test -f "$DEST/dist/index.js"
           test -f "$DEST/package.json"
           test -d "$DEST/node_modules"
           test -f "$DEST/node_modules/@modelcontextprotocol/sdk/package.json"
           assert_grep() {
             local label="$1" file="$2" pattern="$3"
             if ! grep -qE "$pattern" "$file"; then
               echo "::error::Missing $label in $file (pattern: $pattern)"
               exit 1
             fi
            }
            assert_grep 'creative platform tool registration' "$DEST/dist/index.js" 'registerCreativePlatformTools\)[[:space:]]*\([[:space:]]*server'
            assert_grep 'setup readiness tool registration' "$DEST/dist/index.js" 'registerSetupReadinessTool\)[[:space:]]*\([[:space:]]*server'
            assert_grep 'org optimizer tool registration' "$DEST/dist/index.js" 'registerOrgOptimizerTools\)[[:space:]]*\([[:space:]]*server'
           grep -q 'rhythm_list_creative_capabilities' "$DEST/dist/tools/creativePlatform.js"
          grep -q 'rhythm_install_creative_capability' "$DEST/dist/tools/creativePlatform.js"
          grep -q 'rhythm_creative_capability_status' "$DEST/dist/tools/creativePlatform.js"
          grep -q 'rhythm_verify_creative_capability' "$DEST/dist/tools/creativePlatform.js"
          grep -q 'rhythm_record_design' "$DEST/dist/tools/creativePlatform.js"
          grep -q 'rhythm_get_setup_readiness' "$DEST/dist/tools/setupReadiness.js"
          grep -q 'rhythm_run_external_discovery' "$DEST/dist/tools/orgOptimizer.js"

      - name: Smoke-test bundled CLI server
        shell: bash
        run: |
          set -u
          APP="apps/desktop_flutter/build/macos/Build/Products/Release/Rhythm.app"
          SCRIPT="$APP/Contents/Resources/api_server/dist/server.js"
          # #1023 — Run under the BUNDLED Node, not the runner's node. The
          # runner's node always matches the just-compiled better_sqlite3 ABI,
          # so it structurally cannot catch a mismatch; the bundled node is what
          # the user machine actually runs. A better-sqlite3 ABI mismatch fails
          # initDb here (the server exits before /health), failing the release.
          BUNDLED_NODE="$APP/Contents/Resources/node/bin/node"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::Bundled CLI server not found at $SCRIPT"
            exit 1
          fi
          if [ ! -f "$BUNDLED_NODE" ]; then
            echo "::error::Bundled Node runtime not found at $BUNDLED_NODE"
            exit 1
          fi
          SMOKE_HOME="$RUNNER_TEMP/rhythm-package-home"
          SMOKE_DB="$RUNNER_TEMP/smoke.db"
          rm -rf "$SMOKE_HOME" "$SMOKE_DB"
          mkdir -p "$SMOKE_HOME"
          AGENT_LOCAL=true MCP_ROLES_DIR="$APP/Contents/Resources/.mcp-roles" HOME="$SMOKE_HOME" PORT=4002 DB_PATH="$SMOKE_DB" NODE_ENV=test "$BUNDLED_NODE" "$SCRIPT" &
          PID=$!
          cleanup() {
            kill $PID 2>/dev/null || true
            sleep 2
            kill -9 $PID 2>/dev/null || true
          }
          trap cleanup EXIT

          HEALTH_OK=0
          HEALTH_BODY=""
          for i in $(seq 1 60); do
            if ! kill -0 $PID 2>/dev/null; then
              echo "::error::Bundled CLI server process exited before /health responded"
              exit 1
            fi
            if HEALTH_BODY=$(curl -fsS http://localhost:4002/health 2>/dev/null); then
              HEALTH_OK=1
              break
            fi
            perl -e 'select(undef,undef,undef,0.25)'
          done

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "::error::Timed out waiting for /health (15s window)"
            exit 1
          fi
          echo "/health 200: $HEALTH_BODY"

          CAPS_BODY=$(curl -fsS http://localhost:4002/agents/capabilities)
          CAPS_STATUS=$?
          if [ $CAPS_STATUS -ne 0 ]; then
            echo "::error::/agents/capabilities did not return 200"
            exit 1
          fi
          echo "/agents/capabilities 200: $CAPS_BODY"

          printf '%s' "$CAPS_BODY" | node -e '
            let data = "";
            process.stdin.on("data", (c) => data += c);
            process.stdin.on("end", () => {
              let parsed;
              try { parsed = JSON.parse(data); } catch (e) {
                console.error("Response is not valid JSON:", e.message);
                process.exit(1);
              }
              if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
                console.error("Response is not a JSON object");
                process.exit(1);
              }
              const requiredKeys = ["claude-code", "codex", "gemini-cli", "opencode"];
              for (const key of requiredKeys) {
                if (typeof parsed[key] !== "boolean") {
                  console.error("Response missing boolean key " + key + ":", JSON.stringify(parsed));
                  process.exit(1);
                }
              }
              console.log("capabilities OK:", JSON.stringify(parsed));
            });
          '

          # Fresh package proof: staged role resources seed both optimizer
          # profiles and exactly one enabled task for each role.
          for i in $(seq 1 60); do
            if SMOKE_DB="$SMOKE_DB" BUNDLED_API_SERVER="$APP/Contents/Resources/api_server" "$BUNDLED_NODE" -e '
              const Database = require(process.env.BUNDLED_API_SERVER + "/node_modules/better-sqlite3");
              const db = new Database(process.env.SMOKE_DB, { readonly: true });
              const profiles = db.prepare("SELECT COUNT(*) AS n FROM agent_configs WHERE id IN (?, ?)").get("8f1c2d3e-4a5b-4c6d-9e7f-0a1b2c3d4e5f", "9a2d3e4f-5b6c-4d7e-8f9a-1b2c3d4e5f6a").n;
              const tasks = db.prepare("SELECT name, COUNT(*) AS n FROM agent_scheduled_tasks WHERE enabled = 1 AND name IN (?, ?) GROUP BY name").all("Org Self-Optimizer", "Org External Discovery");
              db.close();
              if (profiles !== 2 || tasks.length !== 2 || tasks.some((task) => task.n !== 1)) process.exit(1);
            '; then
              echo "fresh package optimizer profiles/tasks OK"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Fresh bundled boot did not seed both optimizer profiles and exactly one enabled task each"
              exit 1
            fi
            sleep 0.25
          done

      - name: Smoke memory vault authority (#808 guard)
        shell: bash
        run: |
          # Boots the bundled LOCAL agent server (dist/server.js) against a TEMP
          # vault + TEMP SQLite and proves the Obsidian Memory-Vault is the sole
          # authority: a write lands a vault note + index row, and after dropping
          # the SQLite index file entirely it is rebuilt from the surviving vault
          # with identical recall. Local-only (AGENT_LOCAL on a private port); it
          # never touches prod and never logs note bodies.
          SCRIPT="apps/desktop_flutter/build/macos/Build/Products/Release/Rhythm.app/Contents/Resources/api_server/dist/server.js"
          apps/api_server/scripts/smoke_memory_authority.sh "$SCRIPT" 4071

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build opencode fork binary
        working-directory: apps/opencode_fork/packages/opencode
        run: |
          bun install
          # --macos builds only the two darwin targets (arm64 + x64) for the
          # universal bundle, skipping linux/windows/musl/baseline.
          bun run build --macos
          # Assert both architecture binaries were produced before lipo
          if [ ! -f "dist/opencode-darwin-arm64/bin/opencode" ]; then
            echo "::error::opencode fork arm64 binary not found after build"
            exit 1
          fi
          if [ ! -f "dist/opencode-darwin-x64/bin/opencode" ]; then
            echo "::error::opencode fork x64 binary not found after build"
            exit 1
          fi

      - name: Bundle opencode fork binary (universal)
        working-directory: apps/desktop_flutter
        run: |
          APP="build/macos/Build/Products/Release/Rhythm.app"
          DEST="$APP/Contents/Resources/opencode_bin"
          mkdir -p "$DEST"
          ARM64="../../apps/opencode_fork/packages/opencode/dist/opencode-darwin-arm64/bin/opencode"
          X64="../../apps/opencode_fork/packages/opencode/dist/opencode-darwin-x64/bin/opencode"
          lipo -create "$ARM64" "$X64" -output "$DEST/opencode"
          chmod +x "$DEST/opencode"

      - name: Verify bundled opencode fork payload
        working-directory: apps/desktop_flutter
        run: |
          DEST="build/macos/Build/Products/Release/Rhythm.app/Contents/Resources/opencode_bin"
          if [ ! -f "$DEST/opencode" ]; then
            echo "::error::Bundled opencode fork binary not found at $DEST/opencode"
            exit 1
          fi
          if [ ! -x "$DEST/opencode" ]; then
            echo "::error::Bundled opencode fork binary is not executable"
            exit 1
          fi
          echo "opencode fork binary present and executable: OK"

      - name: Smoke opencode fork marker
        working-directory: apps/desktop_flutter
        run: |
          BINARY="build/macos/Build/Products/Release/Rhythm.app/Contents/Resources/opencode_bin/opencode"
          VERSION_OUTPUT="$("$BINARY" --version 2>&1 || true)"
          echo "opencode fork --version output: $VERSION_OUTPUT"
          # Assert the binary is NOT stock opencode (stock releases begin with 1.14.x).
          # The fork embeds the branch/timestamp in its version string.
          if echo "$VERSION_OUTPUT" | grep -qE '^1\.[0-9]+\.[0-9]+$'; then
            echo "::error::Bundled opencode binary reports a stock release version ($VERSION_OUTPUT). Expected the Rhythm fork marker."
            exit 1
          fi
          echo "Fork marker verified: binary is not a stock release."

      - name: Smoke opencode MCP allowlist persistence (#765 guard)
        working-directory: apps/desktop_flutter
        run: |
          BINARY="$PWD/build/macos/Build/Products/Release/Rhythm.app/Contents/Resources/opencode_bin/opencode"
          ../../tools/release/smoke_mcp_allowlist.sh "$BINARY"

      - name: Smoke opencode skill allowlist persistence (#775 guard)
        working-directory: apps/desktop_flutter
        run: |
          BINARY="$PWD/build/macos/Build/Products/Release/Rhythm.app/Contents/Resources/opencode_bin/opencode"
          ../../tools/release/smoke_skill_allowlist.sh "$BINARY"

      - name: Smoke skill unification (no-skill-lost + names alignment guard)
        working-directory: apps/desktop_flutter
        run: |
          BINARY="$PWD/build/macos/Build/Products/Release/Rhythm.app/Contents/Resources/opencode_bin/opencode"
          ../../tools/release/smoke_skill_alignment.sh "$BINARY"

      - name: Smoke MCP alignment (no-server-lost + names alignment guard, #785)
        working-directory: apps/desktop_flutter
        run: |
          BINARY="$PWD/build/macos/Build/Products/Release/Rhythm.app/Contents/Resources/opencode_bin/opencode"
          ../../tools/release/smoke_mcp_alignment.sh "$BINARY"

      - name: Package macOS artifacts
        working-directory: apps/desktop_flutter
        run: ../../tools/release/package_macos.sh

      - name: Sign and notarize when Apple secrets are present
        working-directory: apps/desktop_flutter
        run: ../../tools/release/sign_and_notarize_macos.sh

      - name: Dump signed entitlements for diagnosis
        run: |
          APP="apps/desktop_flutter/build/macos/Build/Products/Release/Rhythm.app"
          echo "=== codesign --display --entitlements - ==="
          codesign --display --entitlements - --xml "$APP" | xmllint --format - || true
          echo "=== codesign -dvvv ==="
          codesign -dvvv "$APP" 2>&1 | head -40 || true

      - name: Verify signed desktop OAuth build
        run: |
          tools/release/verify_desktop_oauth_build.sh --signed \
            apps/desktop_flutter/build/macos/Build/Products/Release/Rhythm.app

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-macos-${{ inputs.version }}
          path: apps/desktop_flutter/dist/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Rhythm ${{ env.RELEASE_TAG }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: ${{ inputs.release_notes == '' }}
          body: ${{ inputs.release_notes }}
          files: |
            apps/desktop_flutter/dist/*.zip
            apps/desktop_flutter/dist/*.dmg
