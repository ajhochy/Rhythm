services:
  rhythm-api:
    image: ${RHYTHM_API_IMAGE:-ghcr.io/ajhochy/rhythm-api:main}
    container_name: rhythm-api
    restart: unless-stopped
    # Opt into the host-wide Watchtower (run by the statements project in
    # label-enable mode, 30-min poll, GHCR creds mounted): a new :main image
    # published by "API Image Publish (GHCR)" is auto-pulled and this
    # container recreated. Verify with: curl -s https://api.vcrcapps.com/health
    # (the commit field must match the merged SHA). cloudflared is
    # intentionally NOT labeled — the tunnel stays pinned.
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - '4000:4000'
    env_file:
      - .env.production
    volumes:
      - rhythm_api_data:/data

  # Mobile relay (docs/ai/plan-synology-relay.md): same image, RHYTHM_ROLE=relay,
  # own SQLite in its own volume. Phones reach it at
  # https://api.vcrcapps.com/relay/* via a Cloudflare public-hostname path rule
  # (path /relay* -> http://rhythm-relay:4000, ABOVE the rhythm-api catch-all).
  # Host port 4010 is the LAN fast path for the Mac's uplink dial.
  rhythm-relay:
    image: ${RHYTHM_API_IMAGE:-ghcr.io/ajhochy/rhythm-api:main}
    container_name: rhythm-relay
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - '4010:4000'
    env_file:
      - .env.relay
    volumes:
      - rhythm_relay_data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rhythm-cloudflared
    restart: unless-stopped
    depends_on:
      - rhythm-api
    env_file:
      - .env.production
    command: tunnel run

volumes:
  rhythm_api_data:
  rhythm_relay_data:
